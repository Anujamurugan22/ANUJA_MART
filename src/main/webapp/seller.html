<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>ANUJA MART - Seller Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f0ff;
        }

        .header {
            background: #6c3fc5;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logout {
            background: white;
            color: #6c3fc5;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        .welcome {
            font-size: 30px;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px #ddd;
            text-align: center;
        }

        .icon {
            font-size: 45px;
        }

        .card h2 {
            color: #333;
        }

        .card a {
            display: inline-block;
            background: #6c3fc5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">ANUJA MART - Seller Central</div>
    <div>
        <a href="products" style="color:white; margin-right:15px; text-decoration:none; font-weight:600;">Browse Store</a>
        <a class="logout" href="logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="welcome">
        Welcome, Seller 🛍️
    </div>

    <div class="cards">

        <div class="card">
            <div class="icon">➕</div>
            <h2>Add Product</h2>
            <a href="add-product.html">Add Product</a>
        </div>

        <div class="card">
            <div class="icon">📦</div>
            <h2>My Products</h2>
            <a href="products?view=seller">View Products</a>
        </div>

        <div class="card">
            <div class="icon">⚙️</div>
            <h2>Manage Products</h2>
            <a href="products?view=seller">Edit / Delete</a>
        </div>

        <div class="card">
            <div class="icon">📋</div>
            <h2>Orders</h2>
            <a href="orders">View Orders</a>
        </div>

    </div>

</div>

</body>
</html>
